[project]
name = "glasses-backend"
version = "0.1.0"
description = "Gemini Live tokens and Google Docs notes for the glasses app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2,<1",
    "google-genai>=2.28.0,<3",
    "google-api-python-client>=2.201.0,<3",
    "google-auth-oauthlib>=1.5.0,<2",
    "python-dotenv>=1.2.4,<2",
    "rapidfuzz>=3.14.6,<4",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=9.1.1,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../scripts"]
